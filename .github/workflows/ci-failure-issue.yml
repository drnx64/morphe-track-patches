name: CI Failure Issue Creator

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

permissions:
  issues: write
  pull-requests: read

jobs:
  create-issue:
    name: Create Issue on Failure
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'failure'
    timeout-minutes: 5
    steps:
      - name: Get workflow run details
        id: details
        uses: actions/github-script@v7
        with:
          script: |
            const run = context.payload.workflow_run;

            const { data: jobs } = await github.rest.actions.listJobsForWorkflowRun({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: run.id,
            });

            const failedJobs = jobs.jobs
              .filter(job => job.conclusion === 'failure')
              .map(job => job.name);

            core.setOutput('workflow_name', run.name);
            core.setOutput('run_id', run.id);
            core.setOutput('run_url', run.html_url);
            core.setOutput('branch', run.head_branch);
            core.setOutput('sha', run.head_sha.substring(0, 7));
            core.setOutput('actor', run.actor.login);
            core.setOutput('failed_jobs', failedJobs.join(', '));

      - name: Check if Dependabot PR
        id: check_pr
        uses: actions/github-script@v7
        with:
          script: |
            const pullRequests = context.payload.workflow_run.pull_requests || [];
            if (pullRequests.length === 0) {
              core.setOutput('is_dependabot', 'false');
              return;
            }

            const prNumber = pullRequests[0].number;
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber,
            });

            core.setOutput('pr_number', prNumber);
            core.setOutput('pr_title', pr.title);
            core.setOutput('pr_url', pr.html_url);
            core.setOutput('is_dependabot', pr.user.login === 'dependabot[bot]' ? 'true' : 'false');

      - name: Check for existing issue
        id: existing
        uses: actions/github-script@v7
        with:
          script: |
            const branch = '${{ steps.details.outputs.branch }}';
            const actor = '${{ steps.details.outputs.actor }}';

            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'ci-failure',
              per_page: 100,
            });

            const existing = issues.find(issue =>
              issue.title.includes(branch) && issue.title.includes(actor)
            );

            if (existing) {
              core.setOutput('issue_number', existing.number);
              core.setOutput('exists', 'true');
              console.log(`Found existing issue #${existing.number}`);
            } else {
              core.setOutput('exists', 'false');
              console.log('No existing issue found');
            }

      - name: Create new issue
        if: steps.existing.outputs.exists == 'false'
        uses: actions/github-script@v7
        with:
          script: |
            const isDependabot = '${{ steps.check_pr.outputs.is_dependabot }}' === 'true';
            const prTitle = '${{ steps.check_pr.outputs.pr_title }}';
            const prNumber = '${{ steps.check_pr.outputs.pr_number }}';
            const prUrl = '${{ steps.check_pr.outputs.pr_url }}';

            const title = isDependabot
              ? `CI Failure: Dependabot PR #${prNumber} — ${prTitle}`
              : `CI Failure: ${{ steps.details.outputs.workflow_name }} on ${{ steps.details.outputs.branch }}`;

            const body = isDependabot
              ? `## Dependabot PR CI Failure

            | Property | Value |
            |----------|-------|
            | **PR** | [#${prNumber}](${prUrl}) — ${prTitle} |
            | **Workflow** | ${{ steps.details.outputs.workflow_name }} |
            | **Branch** | \`${{ steps.details.outputs.branch }}\` |
            | **Commit** | \`${{ steps.details.outputs.sha }}\` |
            | **Failed Jobs** | ${{ steps.details.outputs.failed_jobs }} |
            | **Run** | [View Logs](${{ steps.details.outputs.run_url }}) |

            ### Action Required

            - Review the PR for breaking changes or peer dependency conflicts
            - **Close** if this is a major version upgrade requiring manual migration
            - **Fix and merge** if the change is safe

            ---
            *Auto-created by CI Failure Issue Creator*`
              : `## CI Failure Report

            | Property | Value |
            |----------|-------|
            | **Workflow** | ${{ steps.details.outputs.workflow_name }} |
            | **Branch** | \`${{ steps.details.outputs.branch }}\` |
            | **Commit** | \`${{ steps.details.outputs.sha }}\` |
            | **Triggered by** | @${{ steps.details.outputs.actor }} |
            | **Failed Jobs** | ${{ steps.details.outputs.failed_jobs }} |
            | **Run** | [View Logs](${{ steps.details.outputs.run_url }}) |

            ### Action Required

            1. Check the workflow logs for detailed error messages
            2. Fix the issues and push a new commit
            3. This issue will be auto-closed when the workflow passes

            ---
            *Auto-created by CI Failure Issue Creator*`;

            const labels = isDependabot
              ? ['ci-failure', 'dependencies']
              : ['ci-failure'];

            const issue = await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: title,
              body: body,
              labels: labels,
            });

            console.log(`Created issue #${issue.data.number}`);

      - name: Update existing issue
        if: steps.existing.outputs.exists == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const issueNumber = parseInt('${{ steps.existing.outputs.issue_number }}');
            const isDependabot = '${{ steps.check_pr.outputs.is_dependabot }}' === 'true';

            const comment = isDependabot
              ? `### Still Failing

            | Property | Value |
            |----------|-------|
            | **PR** | [#${{ steps.check_pr.outputs.pr_number }}](${{ steps.check_pr.outputs.pr_url }}) |
            | **Commit** | \`${{ steps.details.outputs.sha }}\` |
            | **Failed Jobs** | ${{ steps.details.outputs.failed_jobs }} |
            | **Run** | [View Logs](${{ steps.details.outputs.run_url }}) |

            *The CI is still failing on this Dependabot PR.*`
              : `### Still Failing

            | Property | Value |
            |----------|-------|
            | **Commit** | \`${{ steps.details.outputs.sha }}\` |
            | **Failed Jobs** | ${{ steps.details.outputs.failed_jobs }} |
            | **Run** | [View Logs](${{ steps.details.outputs.run_url }}) |

            *The CI is still failing.*`;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              body: comment,
            });

            console.log(`Updated issue #${issueNumber}`);

  auto-close-on-success:
    name: Close Issue on Success
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'success'
    timeout-minutes: 5
    steps:
      - name: Find and close issues
        uses: actions/github-script@v7
        with:
          script: |
            const branch = '${{ github.event.workflow_run.head_branch }}';

            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'ci-failure',
              per_page: 100,
            });

            for (const issue of issues) {
              if (issue.title.includes(branch)) {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issue.number,
                  body: `## Resolved

            The workflow **${{ github.event.workflow_run.name }}** is now passing on branch \`${branch}\`.

            [View Successful Run](${{ github.event.workflow_run.html_url }})

            *Auto-closing this issue.*`,
                });

                await github.rest.issues.update({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issue.number,
                  state: 'closed',
                  state_reason: 'completed',
                });

                console.log(`Closed issue #${issue.number}`);
              }
            }
