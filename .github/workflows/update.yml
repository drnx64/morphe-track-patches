name: Update Morphe Patch Data

on:
  schedule:
    - cron: '1 * * * *'
  workflow_dispatch:

concurrency:
  group: morphe-patch-tracker
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Pipeline
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TRIGGER_TYPE: ${{ github.event_name }}
        run: |
          python scripts/run_pipeline.py

      - name: Verify Data Files
        run: |
          echo "Checking essential data files..."
          for f in data/core.json data/stats.json data/changes.json data/changelog.json data/bundles/_index.json; do
            if [ ! -f "$f" ]; then
              echo "ERROR: Missing $f"
              exit 1
            fi
            size=$(stat -c%s "$f" 2>/dev/null || stat -f%z "$f" 2>/dev/null)
            echo "  $f: ${size} bytes"
          done
          echo "All essential files present."

      - name: Commit and Push State Changes to main
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ public/msg.txt
          if ! git diff --cached --quiet; then
            git diff --cached --stat
            git commit -m "chore(data): auto-update Morphe patch tracking state [skip ci]"
            git push origin main
          else
            echo "No changes detected. Skipping commit to main."
          fi
