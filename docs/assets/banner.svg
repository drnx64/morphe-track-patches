<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="50%" style="stop-color:#1e1b4b"/>
      <stop offset="100%" style="stop-color:#0f172a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#6366f1"/>
      <stop offset="50%" style="stop-color:#a78bfa"/>
      <stop offset="100%" style="stop-color:#6366f1"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <linearGradient id="shield" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1"/>
      <stop offset="100%" style="stop-color:#4f46e5"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="300" fill="url(#bg)"/>

  <!-- Grid pattern -->
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(99,102,241,0.06)" stroke-width="1"/>
  </pattern>
  <rect width="1200" height="300" fill="url(#grid)"/>

  <!-- Floating dots decoration -->
  <circle cx="100" cy="60" r="2" fill="#6366f1" opacity="0.3"/>
  <circle cx="200" cy="120" r="1.5" fill="#a78bfa" opacity="0.4"/>
  <circle cx="150" cy="200" r="2.5" fill="#6366f1" opacity="0.2"/>
  <circle cx="1050" cy="80" r="2" fill="#a78bfa" opacity="0.3"/>
  <circle cx="1100" cy="180" r="1.5" fill="#6366f1" opacity="0.4"/>
  <circle cx="1000" cy="240" r="2.5" fill="#a78bfa" opacity="0.2"/>
  <circle cx="300" cy="40" r="1" fill="#818cf8" opacity="0.3"/>
  <circle cx="900" cy="260" r="1" fill="#818cf8" opacity="0.3"/>

  <!-- Accent line top -->
  <rect x="300" y="50" width="600" height="1" fill="url(#accent)" opacity="0.4" rx="0.5"/>

  <!-- Shield icon -->
  <g transform="translate(540, 80)" filter="url(#glow)">
    <path d="M60 0 L120 30 L120 90 C120 130 90 155 60 170 C30 155 0 130 0 90 L0 30 Z"
          fill="url(#shield)" opacity="0.9"/>
    <path d="M60 20 L100 42 L100 85 C100 115 80 135 60 148 C40 135 20 115 20 85 L20 42 Z"
          fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
    <!-- M letter inside shield -->
    <text x="60" y="110" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif"
          font-size="65" font-weight="800" fill="white" opacity="0.95">M</text>
  </g>

  <!-- Title text -->
  <text x="600" y="195" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif"
        font-size="42" font-weight="700" fill="white" letter-spacing="-0.5">
    Morphe Patch Tracker
  </text>

  <!-- Subtitle -->
  <text x="600" y="228" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif"
        font-size="16" fill="#94a3b8" letter-spacing="0.5">
    Automated compatibility, patch discovery &amp; update monitoring
  </text>

  <!-- Accent line bottom -->
  <rect x="300" y="250" width="600" height="1" fill="url(#accent)" opacity="0.4" rx="0.5"/>

  <!-- Corner accents -->
  <path d="M30 30 L30 60" stroke="#6366f1" stroke-width="2" opacity="0.3" stroke-linecap="round"/>
  <path d="M30 30 L60 30" stroke="#6366f1" stroke-width="2" opacity="0.3" stroke-linecap="round"/>
  <path d="M1170 30 L1170 60" stroke="#6366f1" stroke-width="2" opacity="0.3" stroke-linecap="round"/>
  <path d="M1170 30 L1140 30" stroke="#6366f1" stroke-width="2" opacity="0.3" stroke-linecap="round"/>
  <path d="M30 270 L30 240" stroke="#6366f1" stroke-width="2" opacity="0.3" stroke-linecap="round"/>
  <path d="M30 270 L60 270" stroke="#6366f1" stroke-width="2" opacity="0.3" stroke-linecap="round"/>
  <path d="M1170 270 L1170 240" stroke="#6366f1" stroke-width="2" opacity="0.3" stroke-linecap="round"/>
  <path d="M1170 270 L1140 270" stroke="#6366f1" stroke-width="2" opacity="0.3" stroke-linecap="round"/>
</svg>
